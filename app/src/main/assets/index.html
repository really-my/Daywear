async function climateNormal(city){const key='daywear-5year-era5-v2|'+normalStart+'-'+normalEnd+'|'+city.latitude+','+city.longitude;if(climateCache.has(key))return climateCache.get(key);try{const saved=JSON.parse(localStorage.getItem(key));if(saved&&Object.keys(saved).length>=365){climateCache.set(key,saved);return saved}}catch{}const p=(async()=>{const r=await fetch('https://archive-api.open-meteo.com/v1/archive?latitude='+city.latitude+'&longitude='+city.longitude+'&start_date='+normalStart+'-01-01&end_date='+normalEnd+'-12-31&daily=temperature_2m_max,temperature_2m_min&models=era5&timezone=auto',{signal:AbortSignal.timeout(90000)});if(!r.ok)throw Error('climate');const raw=await r.json();if(!raw.daily)throw Error('climate');const v=aggregateNormal(raw.daily);if(Object.keys(v).length<365)throw Error('incomplete climate');try{localStorage.setItem(key,JSON.stringify(v))}catch{}return v})();climateCache.set(key,p);try{return await p}catch(e){climateCache.delete(key);throw e}}

function paintTrip(t,data,normals,loading=false,failed=false){const days=dates(t.start,t.end);$('#tripDetail').innerHTML='<div class="tripmeta"><p>'+esc(t.city.name)+' · '+t.start+' — '+t.end+'</p><div class="refresh-actions"><button class="outline" id="refreshTrip">↻ 새로고침</button><button class="delete" data-deletetrip="'+t.id+'">여행 삭제</button></div></div>'+days.map((date,i)=>{const key=t.id+'|'+date,f=dailyRange(data,date),n=normals?.[date.slice(5)],r=f||n,s=f?samples(data,date):null;tripSamples[key]=s||(r?[{feel:r.lo},{feel:r.hi},{feel:r.lo}]:null);const rec=tripSamples[key]?recommend(tripSamples[key]):null;return '<article class="outfit-day"><div class="outfit-dayhead"><div><span class="daynumber">DAY '+String(i+1).padStart(2,'0')+'</span><h3>'+date.slice(5).replace('-','.')+' <span class="small">'+new Intl.DateTimeFormat('ko',{weekday:'short',timeZone:'UTC'}).format(new Date(date+'T12:00:00Z'))+'</span></h3></div><div class="mini-weather">'+(r?'<b>'+Math.round(r.hi)+'°</b><span> / '+Math.round(r.lo)+'°</span><small title="'+(f?'현지 날짜의 하루 최고·최저 예보':''+normalStart+'–'+normalEnd+' ERA5 같은 월·일의 일최고·일최저 평균. 2월 29일은 2월 28일과 3월 1일 평균으로 보간.')+'">'+(f?'실제 예보':'최근 5년 평균')+'</small>': '<small>'+ (loading?'최근 5년 평균 계산 중…':'날씨 연결 실패 · 새로고침')+'</small>')+'</div></div><div class="mini-recommend">'+(rec?'<span><em>OUTER</em> '+esc(rec.outer)+'</span><span><em>INNER</em> '+esc(rec.inner)+'</span>':'<span>상품을 먼저 추가할 수 있습니다.</span>')+'</div>'+productCards(boardItems(key),key)+'</article>'}).join('')+'<details class="normal-info"><summary>최근 5년 평균 기준</summary><p>'+normalStart+'–'+normalEnd+'년 ERA5 같은 월·일의 일최고·일최저기온 평균입니다. 2월 29일은 2월 28일과 3월 1일의 평균으로 보간합니다. 30년 기후평년값과 구분되는 최근 5년 참고값이며, 예보가 제공되면 예보를 우선합니다. 평균값 기반 코디는 기온 기준입니다.</p></details>';}

function currentLocation(){if(locating)return;locating=true;const token=++locationToken;request++;weather=null;$('#location').textContent='⌖ 현재 위치 확인 중';$('#weatherStatus').textContent='위치를 확인하고 있습니다.';$('#weather').innerHTML='<div class="statusbox">현재 위치의 날씨를 준비합니다.</div>';$('#dailyAdvice').innerHTML='';window.daywearLocation=(lat,lon,error)=>{if(token!==locationToken)return;locating=false;if(error||!Number.isFinite(lat)||!Number.isFinite(lon)){ $('#location').textContent='⌖ 도시 선택';$('#weatherStatus').textContent='현재 위치 확인 불가';$('#weather').innerHTML='<div class="statusbox">위치 권한과 휴대폰 위치 설정을 확인하거나 도시를 직접 선택하세요.<div class="actions"><button class="outline" id="currentLocation">현재 위치 다시 확인</button><button class="primary" id="chooseLocation">도시 선택</button></div></div>';return;}state.city={name:'현재 위치',latitude:lat,longitude:lon};state.locationMode='current';persist();loadDaily()};if(window.DaywearNative){window.DaywearNative.requestLocation();return}if(navigator.geolocation){navigator.geolocation.getCurrentPosition(p=>window.daywearLocation(p.coords.latitude,p.coords.longitude,null),()=>window.daywearLocation(null,null,'unavailable'),{enableHighAccuracy:false,timeout:20000,maximumAge:300000})}else window.daywearLocation(null,null,'unsupported')}
function chooseDailyCity(){openCity(c=>{locationToken++;locating=false;state.city=c;state.locationMode='manual';persist();loadDaily()});const button=document.createElement('button');button.type='button';button.className='outline';button.textContent='⌖ 현재 위치 사용';button.style.marginBottom='16px';button.onclick=()=>{closeModal();currentLocation()};$('#cityForm').before(button)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(b?.id==='currentLocation')currentLocation();if(b?.id==='chooseLocation')chooseDailyCity()});
document.addEventListener('click',e=>{const a=e.target.closest('a[href]');if(!a||!window.DaywearNative)return;try{const u=new URL(a.href);if(u.protocol==='http:'||u.protocol==='https:'){e.preventDefault();window.location.href=u.href}}catch{}},true);

$('#sensitivity').value=state.sensitivity;$('#sensitivity').onchange=e=>{state.sensitivity=Number(e.target.value);persist();if(weather)renderDaily();if(!$('#travel').classList.contains('hidden'))renderTrip()};if(state.locationMode==='manual')loadDaily();else currentLocation();
</script></body></html>
